server.port=${PORT:8081}

# Conexión directa a Neon (sin -pooler para evitar Connection reset)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://ep-sparkling-mouse-b6k53dvf.c-2.sa-east-1.aws.neon.tech/neondb?sslmode=require&channelBinding=disable}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:neondb_owner}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:npg_9ZwAzYx1ItbF}
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuración de pool de conexiones para que no se corte
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=5

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect